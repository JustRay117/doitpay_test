apiVersion: apps/v1
kind: Deployment
metadata:
  name: paytrack-api
  namespace: paytrack
  labels:
    app: paytrack-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paytrack-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: paytrack-api
    spec:
      containers:
        - name: paytrack-api
          # Placeholder registry (123456789012 is the AWS example account).
          image: 123456789012.dkr.ecr.ap-southeast-3.amazonaws.com/paytrack-api:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: paytrack-api-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
