name: Validate
on:
  pull_request:
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests with kubeconform
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -verbose -kubernetes-version 1.36.0 /k8s

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan configuration with Trivy
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            ghcr.io/aquasecurity/trivy:0.76.2 \
            config --skip-dirs infra/.terraform \
            --severity HIGH,CRITICAL --exit-code 1 .
